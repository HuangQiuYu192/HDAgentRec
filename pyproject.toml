[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hdagentrec"
version = "0.1.0"
description = "Hindsight-Guided Dynamic User Agents for Sequential Recommendation"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["hdagentrec*"]
