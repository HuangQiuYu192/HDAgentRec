# SASRec paper-reproduction settings: public AgentCF data + its declared setup.
data_path: dataset/
benchmark_filename: [train, valid, test]
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
load_col:
  inter: [user_id, item_id_list, item_id]
alias_of_item_id: [item_id_list]
eval_args:
  split: {LS: valid_and_test}
  order: TO
  mode: full
repeatable: true
loss_type: CE
train_neg_sample_args: ~
train_batch_size: 4096
eval_batch_size: 100
learning_rate: 0.001
epochs: 300
stopping_step: 10
valid_metric: NDCG@10
metrics: [Recall, NDCG]
topk: [1, 3, 5, 7, 10]
agentcf_candidate_file: CDs-100-user-dense.random
recall_budget: 10
eval_repeats: 3
has_gt: true
fix_pos: -1
seed: 2020
reproducibility: true
show_progress: true
