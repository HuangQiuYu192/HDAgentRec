# RecBole owns data loading, temporal split, SASRec training and metrics.
MODEL_TYPE: sequential
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, timestamp]
eval_args:
  group_by: user
  order: TO
  split: {LS: valid_and_test}
  mode: full
metrics: [Hit, NDCG, MRR]
topk: [5, 10]
valid_metric: NDCG@10
loss_type: CE
train_neg_sample_args: ~
embedding_size: 128
n_layers: 2
n_heads: 4
hidden_size: 128
inner_size: 512
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
max_seq_length: 50
train_batch_size: 256
learning_rate: 0.001
epochs: 100
stopping_step: 10
seed: 42
reproducibility: true
show_progress: true
agent_candidate_m: 20
