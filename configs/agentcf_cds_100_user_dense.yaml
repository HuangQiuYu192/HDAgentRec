# Faithful Phase-1 comparison protocol for AgentCF's public CDs benchmark.
data_path: dataset/
benchmark_filename: [train, valid, test]
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 20
load_col:
  inter: [user_id, item_id_list, item_id]
alias_of_item_id: [item_id_list]
eval_args:
  split: {LS: valid_and_test}
  order: TO
  mode: full
repeatable: true
loss_type: CE
train_neg_sample_args: ~
embedding_size: 64
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
hidden_act: gelu
layer_norm_eps: 1.0e-12
initializer_range: 0.02
train_batch_size: 20
eval_batch_size: 200
learning_rate: 0.001
epochs: 300
stopping_step: 10
valid_metric: NDCG@10
metrics: [Recall, NDCG, MRR]
topk: [1, 3, 5, 7, 10]
agent_candidate_m: 20
recall_budget: 20
has_gt: true
fix_pos: -1
agentcf_candidate_file: CDs-100-user-dense.random
seed: 42
reproducibility: true
show_progress: true
